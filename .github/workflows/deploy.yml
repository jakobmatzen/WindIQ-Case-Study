name: Deploy

# dev -> development environment (dev.<domain>)
# main    -> production environment  (<domain>)
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

# Never run two deploys of the same environment at once.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  build:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.TARGET_ENV }}
            ${{ env.IMAGE_REPO }}:${{ env.TARGET_ENV }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ env.TARGET_ENV }}
          cache-to: type=gha,mode=max,scope=${{ env.TARGET_ENV }}

  migrate:
    # Runs after a successful build, before the new code goes live.
    # Keep migrations backwards compatible (old code keeps running for a minute).
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Apply Drizzle migrations
        run: bun run db:migrate
        env:
          # Supabase SESSION pooler (port 5432). GitHub runners have no IPv6,
          # so the direct db.<ref>.supabase.co connection does not work here.
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Write runtime env file
        run: |
          {
            printf 'APP_ENV=%s\n' "$TARGET_ENV"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'WINDIQ_API_BASE_URL=%s\n' "$WINDIQ_API_BASE_URL"
            printf 'WINDIQ_CLIENT_ID=%s\n' "$WINDIQ_CLIENT_ID"
            printf 'WINDIQ_CLIENT_SECRET=%s\n' "$WINDIQ_CLIENT_SECRET"
          } > "app.${TARGET_ENV}.env"
        env:
          # Supabase TRANSACTION pooler (port 6543) for the running app.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WINDIQ_API_BASE_URL: ${{ vars.WINDIQ_API_BASE_URL || 'https://windiq-mock-api.sliplane.app' }}
          WINDIQ_CLIENT_ID: ${{ secrets.WINDIQ_CLIENT_ID }}
          WINDIQ_CLIENT_SECRET: ${{ secrets.WINDIQ_CLIENT_SECRET }}

      - name: Upload compose files and env
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile "app.${TARGET_ENV}.env" \
            "deploy@${{ secrets.SSH_HOST }}:/opt/windiq/"

      - name: Pull and restart containers
        run: |
          ssh "deploy@${{ secrets.SSH_HOST }}" \
            "TARGET_ENV=$TARGET_ENV GH_ACTOR=${{ github.actor }} GH_TOKEN=${{ secrets.GITHUB_TOKEN }} bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/windiq
          chmod 600 "app.${TARGET_ENV}.env"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker compose pull "app-${TARGET_ENV}" "worker-${TARGET_ENV}"
          # --wait blocks until the containers' healthchecks report healthy.
          docker compose up -d --wait --wait-timeout 120 "app-${TARGET_ENV}" "worker-${TARGET_ENV}"
          docker compose up -d caddy
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          docker logout ghcr.io
          docker image prune -f
          REMOTE

      - name: Smoke test (public URL, full health check)
        # The worker syncs right after start, so /api/health should turn 200 within ~2 min.
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o body.json -w '%{http_code}' "$APP_URL/api/health" || true)
            echo "attempt $i: HTTP $code $(cat body.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::$APP_URL/api/health did not become healthy"
          exit 1
        env:
          APP_URL: ${{ vars.APP_URL }}
